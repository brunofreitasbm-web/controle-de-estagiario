# ============================================================
# Configuração do Netlify — Controle de Estagiário (Porto Terapia)
# ============================================================
# Usado quando você conecta este projeto ao Netlify via Git.
# (Se preferir arrastar a pasta "dist" no site do Netlify, este arquivo é ignorado
#  e não faz mal nenhum deixá-lo aqui.)

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Evita retornar index.html (MIME text/html) para assets JS/CSS inexistentes (404 real)
[[redirects]]
  from = "/assets/*"
  to = "/assets/:splat"
  status = 404

# App de página única: qualquer rota cai no index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Garantir que o index.html e arquivos do Service Worker nunca fiquem presos no cache do navegador após deploys
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/registerSW.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"


