# ============================================================
# Configuração do Netlify — Gestão de Pessoas (Porto Terapia)
# ============================================================
# Usado quando você conecta este projeto ao Netlify via Git.
# (Se preferir arrastar a pasta "dist" no site do Netlify, este arquivo é ignorado
#  e não faz mal nenhum deixá-lo aqui.)

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Evita retornar index.html (MIME text/html) para assets JS/CSS inexistentes (404 real)
[[redirects]]
  from = "/assets/*"
  to = "/assets/:splat"
  status = 404

# App de página única: qualquer rota cai no index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Garantir que o index.html e arquivos do Service Worker nunca fiquem presos no cache do navegador após deploys
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/registerSW.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cabeçalhos de segurança HTTP (aplicados a toda rota). CSP calibrada para o
# que o app realmente usa: Supabase (REST + Realtime), fonte Inter via Google
# Fonts (usada inclusive dentro das janelas de impressão, que herdam esta
# política), WebAssembly do face-api.js/tfjs, câmera/GPS para ponto e
# biometria, e o html2pdf.js carregado sob demanda do cdnjs para exportar PDF.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; connect-src 'self' https://*.supabase.co wss://*.supabase.co; img-src 'self' data: blob:; media-src 'self' blob:; script-src 'self' 'wasm-unsafe-eval' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; frame-src 'self' data: blob:; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), geolocation=(self), microphone=()"


